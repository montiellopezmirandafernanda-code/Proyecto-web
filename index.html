<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Web - CBTIS 202</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #80deea);
            color: #004d40;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
            backdrop-filter: blur(8px);
        }
        h1 {
            color: #00695c;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #00796b;
        }
        .badge {
            display: inline-block;
            background: #26a69a;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Proyecto Web Desplegado con Éxito!</h1>
        <p>Esta página fue creada y configurada para la tarea de despliegue en la nube.</p>
        <div class="badge">CBTIS 202 - Programación</div>
    </div>

</html>
